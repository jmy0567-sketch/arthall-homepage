name: 인스타그램 피드 갱신

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 한국시간 오전 6:17
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apify로 게시물 가져오기
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/fetch-instagram.mjs
      - name: 바뀐 내용 커밋
        run: |
          git add assets/instagram
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "인스타그램 피드 갱신"
          git push
