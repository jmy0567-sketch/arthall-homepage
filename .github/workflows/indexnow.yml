# 홈페이지(html)가 바뀌어 main에 올라가면 네이버·빙에 "새로 바뀌었어요"를 알린다 (IndexNow).
# 키 파일: 5239289a447da62b673d79ffb225f294.txt (지우면 알림이 거절됨)
name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['*.html', 'sitemap.xml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages deploy
        run: sleep 90
      - name: Notify Naver and Bing
        run: |
          K=5239289a447da62b673d79ffb225f294
          B=https://jmy0567-sketch.github.io/arthall-homepage
          BODY="{\"host\":\"jmy0567-sketch.github.io\",\"key\":\"$K\",\"keyLocation\":\"$B/$K.txt\",\"urlList\":[\"$B/\",\"$B/yearend.html\"]}"
          for E in https://searchadvisor.naver.com/indexnow https://www.bing.com/indexnow; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" "$E")
            echo "$E -> $code"
          done
